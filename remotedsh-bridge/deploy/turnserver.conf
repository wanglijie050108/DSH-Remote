# coturn 配置（02 §4 关键行）
# 取值依据：服务器带宽 3Mbps（用户 2026-09-12 确认）。若未来升配带宽，max-bps / bps-capacity 最先要改。
listening-port=3478
fingerprint
lt-cred-mech                    # 必须。coturn 文档：WebRTC relaying will not work with anonymous access
use-auth-secret
static-auth-secret=<S>          # 与 Signal 同源注入（compose secret / .env），不入库
realm=<domain>
min-port=49160
max-port=49999                  # 840 个 relay 端口：全 TURN 最坏 2 端口/对 → 支撑 420 对，与 pair 上限 256 匹配
no-tls
no-cli
max-bps=250000                  # 单会话带宽上限 ≈2Mbps（250KB/s）：留出两路并发中继共存的空间
bps-capacity=350000             # 整机合计 ≈2.8Mbps——3Mbps 线路扣 ~0.2Mbps 给 WSS 信令/TLS；此参数是全局总量，不是单用户
stale-nonce=1200
external-ip=<公网IP>/<内网IP>    # NAT 环境（云主机）必须；配错 = 打洞与中继同时全挂且不报错
log-file=/var/log/turn
simple-log

# 注意不设 no-tcp：契约 §5 的 uris 含 turn:<host>:3478?transport=tcp（UDP 被封网络的兜底）。
#   no-tls 只关闭 5349 的 TLS/DTLS 监听，不影响 3478 的 TCP 监听。5349/turns: 不在 v1 范围。
# user-quota 若设置 MUST ≥ 2：两端拿到的是同一个 coturn 用户名（username="<expire>:<pair_id>"）。
# 不要开 --prometheus-username-labels：coturn 文档明确警告，ephemeral usernames 下会导致内存泄漏。
# 按天流量配额（≤200MB/天/对）：coturn 无原生按天配额，由部署侧用量监控告警执行。
